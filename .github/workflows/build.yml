# Сборка APK лаунчера CZ Deleted Scenes вместе с ПЕРЕСОБРАННОЙ серверной библиотекой (libserver.so).
# Этап 1: правки HUD и оружия в ReGameDLL. НЕ ПРОВЕРЕНО в этой среде (нет NDK и сети), поэтому
# при падении сборки пришлите текст ошибки из шага, который стал красным.
name: build-apk
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Форк ReGameDLL, который использует сам клиент cs16-client (подмодуль 3rdparty/ReGameDLL_CS)
      - name: Скачать ReGameDLL_CS
        run: git clone --depth 1 https://github.com/Vladislav4KZ/ReGameDLL_CS.git server/ReGameDLL_CS

      - name: Применить правки CZDS (HUD и оружие)
        run: |
          python3 server/apply_czds_patches.py server/ReGameDLL_CS
          git -C server/ReGameDLL_CS diff --stat

      - name: Собрать libserver.so (arm64-v8a)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -n1)"
          fi
          echo "NDK: $NDK"
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build
          cmake -S server/ReGameDLL_CS -B build/server-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DXASH_COMPAT=ON
          cmake --build build/server-arm64 --parallel --verbose
          SO="$(find build/server-arm64 -name libserver.so | head -n1)"
          test -n "$SO" || { echo "libserver.so не найден"; exit 1; }
          echo "Собрано: $SO"
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm -D --defined-only "$SO" | grep -E "GiveFnptrsToDll|GetEntityAPI" || { echo "нет экспортов игровой библиотеки"; exit 1; }
          mkdir -p app/src/main/jniLibs/arm64-v8a out
          cp "$SO" app/src/main/jniLibs/arm64-v8a/libserver.so
          cp "$SO" out/libserver-arm64-v8a.so
          sha256sum "$SO"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: czds-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: libserver-arm64-v8a
          path: out/libserver-arm64-v8a.so

      - name: Логи CMake при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: |
            build/server-arm64/CMakeFiles/CMakeOutput.log
            build/server-arm64/CMakeFiles/CMakeError.log
            build/server-arm64/.ninja_log
          if-no-files-found: ignore
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/**/*.log
            **/CMakeFiles/*.log
